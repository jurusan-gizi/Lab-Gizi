<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SILAB Gizi</title>
<meta name="description" content="Sistem Informasi Laboratorium Jurusan Gizi Poltekkes Kemenkes Makassar">
<meta name="theme-color" content="#00988F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
[hidden]{display:none!important} body{margin:0} img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: header berlogo + navigasi bawah di HP / tab atas di layar lebar; konten satu kolom maks 1000px.
   Warna diambil dari logo Kemenkes Poltekkes Makassar (tosca, lime, biru langit). */
:root{
  --bg:#F3F7F6; --surface:#FFFFFF; --surface-2:#EAF2F0; --ink:#132C2A; --muted:#58706D; --line:#D7E3E0;
  --primary:#00988F; --primary-strong:#007A73; --primary-soft:#D6F1EE; --on-primary:#FFFFFF;
  --lime:#B9C91C; --lime-soft:#F1F5CF; --sky:#4FB3C6;
  --ok:#23864D; --ok-soft:#DDF2E5; --warn:#A86F00; --warn-soft:#FBEFD2; --bad:#C23B3B; --bad-soft:#F9DEDE; --info:#2A6FB0; --info-soft:#DCEAF7;
  --shadow:0 1px 2px rgba(19,44,42,.06),0 4px 14px rgba(19,44,42,.06);
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1817; --surface:#142321; --surface-2:#1B2E2C; --ink:#E2EEEC; --muted:#97AEAB; --line:#294240;
  --primary:#2CC2B7; --primary-strong:#5AD6CD; --primary-soft:#173F3B; --on-primary:#062120;
  --lime:#CFDD45; --lime-soft:#2E331A; --sky:#6FC7D8;
  --ok:#5BCB8A; --ok-soft:#173826; --warn:#E3B04B; --warn-soft:#3A2E14; --bad:#F07B7B; --bad-soft:#3E1C1C; --info:#7DB4E8; --info-soft:#18304A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1817; --surface:#142321; --surface-2:#1B2E2C; --ink:#E2EEEC; --muted:#97AEAB; --line:#294240;
  --primary:#2CC2B7; --primary-strong:#5AD6CD; --primary-soft:#173F3B; --on-primary:#062120;
  --lime:#CFDD45; --lime-soft:#2E331A; --sky:#6FC7D8;
  --ok:#5BCB8A; --ok-soft:#173826; --warn:#E3B04B; --warn-soft:#3A2E14; --bad:#F07B7B; --bad-soft:#3E1C1C; --info:#7DB4E8; --info-soft:#18304A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo-chip{background:#fff;border-radius:8px;padding:4px 6px;display:flex;align-items:center;flex:0 0 auto}
.logo-chip img{height:34px;width:auto;display:block}
.brand{display:flex;flex-direction:column;min-width:0;border-left:2px solid var(--lime);padding-left:10px}
.brand .eyebrow{white-space:nowrap;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--primary)}
.brand .name{font-weight:800;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary-strong);display:grid;place-items:center;font-weight:800;font-size:.8rem;border:0;cursor:pointer}
.mode-badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--lime-soft);color:var(--ink);border:1px solid var(--lime)}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:1000px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--primary)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
.nav .dot{position:absolute;top:4px;right:calc(50% - 18px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:.65rem;display:grid;place-items:center}
@media (min-width:820px){
  .nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);z-index:19}
  .nav-in{padding:0 16px;justify-content:flex-start;gap:4px}
  .nav button{flex:0 0 auto;flex-direction:row;gap:8px;padding:12px 14px;font-size:.88rem}
  .nav button svg{width:18px;height:18px}
  .nav button[aria-current="page"]::before{top:auto;bottom:0;left:10px;right:10px;border-radius:3px 3px 0 0}
  .nav .dot{position:static}
  main{padding-bottom:40px!important}
}

main{max-width:1000px;margin:0 auto;padding:18px 16px 96px;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head p{color:var(--muted);font-size:.9rem;margin-top:2px}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:650;font-size:.9rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-strong)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:6px 10px;font-size:.8rem;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.8rem;font-weight:650;color:var(--muted)}
.field input,.field select,.field textarea,.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1 1 220px}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center;min-width:0}
.row .grow{flex:1;min-width:0}
.ttl{font-weight:700;overflow-wrap:anywhere}
.section-title{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-wait{background:var(--warn-soft);color:var(--warn)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-neutral{background:var(--surface-2);color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:820px){.kpis{grid-template-columns:repeat(6,1fr)}}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--k,var(--primary))}
.kpi .v{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.kpi .l{font-size:.75rem;color:var(--muted);font-weight:600}

/* Alat cards */
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.alat{display:flex;flex-direction:column;gap:10px}
.thumb{width:56px;height:56px;border-radius:10px;flex:0 0 auto;background:var(--primary-soft);color:var(--primary-strong);display:grid;place-items:center;font-weight:800;font-size:.9rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.avail{display:flex;align-items:center;gap:8px;font-size:.8rem}
.bar{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* Stok */
.stok{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.lvl{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;grid-column:1/-1}
.lvl i{display:block;height:100%;border-radius:4px}

/* Timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:26px 1fr;gap:10px;position:relative;padding-bottom:16px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:12px;top:24px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--primary)}
.tl .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);border:2px solid var(--line);font-size:.75rem;font-weight:800;z-index:1}
.tl li.done .ic{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.tl li.now .ic{background:var(--surface);border-color:var(--warn);color:var(--warn)}
.tl li.fail .ic{background:var(--bad);border-color:var(--bad);color:#fff}
.tl .t{font-weight:700;font-size:.92rem}
.tl .d{font-size:.8rem;color:var(--muted)}

/* Table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}

/* Horizontal bars */
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px 10px;font-size:.84rem}
.hbar .track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--sky);border-radius:4px}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(6,20,19,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.sheet{border-radius:16px}}
.sheet>*{flex-shrink:0}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.1rem;flex:0 0 auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* Login */
.login{max-width:440px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;gap:18px}
.login-logo{background:#fff;border-radius:14px;padding:14px;display:flex;justify-content:center;border:1px solid var(--line)}
.login-logo img{height:64px;width:auto}
.login h1{font-size:1.6rem;font-weight:800}
.login h1 span{color:var(--primary)}
.demo-pick{display:flex;flex-direction:column;gap:8px}
.demo-pick button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer}
.demo-pick button:hover{border-color:var(--primary)}
.empty{text-align:center;padding:28px 12px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.note{background:var(--lime-soft);border:1px solid var(--lime);border-radius:10px;padding:10px 12px;font-size:.84rem}
.warnbox{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:.86rem;font-weight:600}
.qr-box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;background:#fff;color:#111;border-radius:12px;border:1px solid var(--line)}
.qr-box canvas,.qr-box img{width:180px!important;height:180px!important}
.doc-preview{background:#fff;color:#111;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:.78rem;display:flex;flex-direction:column;gap:8px}
.doc-preview img{height:30px;width:auto}
.doc-preview table{font-size:.74rem}
.doc-preview th{background:#EEF4F3;color:#333}
.doc-preview th,.doc-preview td{border-bottom:1px solid #ddd;padding:5px 6px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}

/* ===== Cover / halaman depan ===== */
.cover{max-width:1000px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:30px}
.hero{position:relative;overflow:hidden;background:var(--primary-soft);border-radius:20px;padding:28px 20px 22px;display:flex;flex-direction:column;gap:14px}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:0 50% 50% 50%;background:var(--lime);opacity:.55;transform:rotate(45deg)}
.hero::before{content:"";position:absolute;right:58px;top:-70px;width:120px;height:170px;border-radius:60px;background:var(--primary);opacity:.18}
.hero>*{position:relative;z-index:1}
.hero-eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--primary-strong)}
.hero h1{font-size:clamp(2.3rem,9vw,3.4rem);font-weight:800;letter-spacing:-.02em;line-height:1}
.hero h1 span{color:var(--primary)}
.lead{font-size:1rem;max-width:58ch;color:var(--ink)}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.btn.lg{padding:12px 18px;font-size:.98rem;border-radius:12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 0}
.facts div{background:var(--surface);border-radius:12px;padding:10px 12px}
.facts dt{font-size:.72rem;color:var(--muted);font-weight:650}
.facts dd{margin:2px 0 0;font-size:1.5rem;font-weight:800;line-height:1.1}
.cv-sec{display:flex;flex-direction:column;gap:12px}
.cv-sec h2{font-size:1.15rem}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.feat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:600px){.feat{grid-template-columns:1fr}}
.f{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.f svg{width:22px;height:22px;flex:0 0 auto;color:var(--primary);margin-top:2px}
.f p{color:var(--muted);font-size:.88rem;margin-top:2px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:650;font-size:.85rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.wide{display:flex}.seg.wide button{flex:1}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:4px 12px;position:relative;padding-bottom:16px}
.steps li::before{content:counter(s);grid-row:1/3;width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:800;font-size:.85rem;z-index:1}
.steps li::after{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li p{color:var(--muted);font-size:.9rem;grid-column:2}
.rules{margin:0;padding:14px 14px 14px 34px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.rules li::marker{color:var(--primary)}
.when{display:flex;flex-direction:column;min-width:96px;font-size:.84rem}
.when .mono{color:var(--muted)}
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.lab{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.lab .code{flex:0 0 auto;width:52px;text-align:center;padding:6px 0;border-radius:8px;background:var(--lime-soft);color:var(--ink);font-weight:700;border:1px solid var(--lime)}
.cv-foot{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line);padding-top:20px}
.cv-foot img{height:30px;width:auto;background:#fff;border-radius:6px;padding:3px 5px}

/* ===== SOP, kalender, sesi ===== */
.sop-link,.sop-none{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:650;border-radius:8px;padding:6px 10px}
.sop-link{color:var(--primary-strong);background:var(--primary-soft);text-decoration:none}
.sop-link svg{width:15px;height:15px}
.sop-none{color:var(--muted);background:var(--surface-2)}
.sop-link.sm,.sop-none.sm{font-size:.76rem;padding:4px 8px;margin-top:6px}
.cal{padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .dow{font-size:.7rem;font-weight:700;color:var(--muted);padding:2px 0}
.day{border:1px solid transparent;background:var(--surface-2);border-radius:9px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:.86rem;padding:2px}
.day i{font-style:normal;font-size:.62rem;line-height:1;color:var(--primary);font-weight:800;letter-spacing:1px}
.day.today{border-color:var(--primary);font-weight:800}
.day.sel{background:var(--primary);color:var(--on-primary)}
.day.sel i{color:var(--on-primary)}
.sesi-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sesi-opt{position:relative;cursor:pointer}
.sesi-opt input{position:absolute;opacity:0}
.sesi-opt span{display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface)}
.sesi-opt small{color:var(--muted);font-size:.74rem}
.sesi-opt input:checked+span{border-color:var(--primary);background:var(--primary-soft)}
.sesi-opt input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
@media (max-width:400px){.sesi-pick{grid-template-columns:1fr}}

  function load() {
    if (mem) return mem;

    if (!mem) { mem = seed(); save(); }
    return mem;

  function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { } }
  function reset() { mem = seed(); save(); }

  const err = m => { throw new Error(m); };
  const nextId = (arr, prefix, field = 'id') => {
    let max = 0; arr.forEach(r => { const m = String(r[field]).match(/(\d+)$/); if (m && String(r[field]).startsWith(prefix)) max = Math.max(max, +m[1]); });
    return prefix + String(max + 1).padStart(3, '0');
  };
  const publicUser = u => { const { pin, ...rest } = u; return rest; };
  // Samarkan NIM untuk tampilan publik: P07131224001 -> P0713****001
  const mask = v => { v = String(v || ''); return v.length > 8 ? v.slice(0, 5) + '****' + v.slice(-3) : v.replace(/.(?=.{2})/g, '*'); };
  // Batas salah login: 5x, lalu dikunci 15 menit (sama dengan Code.gs)
  const fails = {};
  function cekKunci(id) { const f = fails[id]; if (f && f.until > Date.now()) err(`Terlalu banyak percobaan. Coba lagi ${Math.ceil((f.until - Date.now()) / 60000)} menit lagi.`); }
  function catatGagal(id, msg) { let f = fails[id]; if (!f || (f.until && f.until <= Date.now())) f = fails[id] = { n: 0, until: 0 }; f.n++; if (f.n >= 5) { f.until = Date.now() + 15 * 60000; f.n = 0; } err(msg); }
  // Sesi Lab PM/MSPMI (lab dengan mode_jadwal = 'sesi')
  const SESI = { 'Sesi 1': ['08:00', '12:00'], 'Sesi 2': ['13:00', '17:00'], 'Seharian': ['08:00', '17:00'] };

  const normNim = v => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/O/g, '0');
  const findMhs = (db, nim) => db.mahasiswa.find(x => normNim(x.nim) === normNim(nim));

  // Tahun lahir diambil otomatis dari kolom Tanggal Lahir (format apa pun: 17/08/2005, 2005-08-17, 17 Agustus 2005)
  const tahunLahir = t => (String(t || '').match(/(19|20)\d{2}/) || [''])[0];

  // Jumlah unit alat yang sedang terikat permohonan aktif
  function terpakai(db, kode, exceptId) {
    const aktif = new Set(db.pinjam.filter(p => ['Disetujui', 'Dipinjam', 'Dikembalikan'].includes(p.status) && p.id !== exceptId).map(p => p.id));
    return db.detail.filter(d => d.kode_alat === kode && aktif.has(d.id_pinjam)).reduce((s, d) => s + Number(d.jml), 0);
  }

  const handlers = {
    login(db, p) {
      if (p.mode === 'mahasiswa') {
        const key = normNim(p.id_user); cekKunci(key);
        const m = findMhs(db, p.id_user);
        if (!m) catatGagal(key, 'NIM tidak terdaftar. Hubungi admin laboratorium.');
        if (tahunLahir(m.tgl_lahir) !== String(p.pin || '').trim()) catatGagal(key, 'NIM atau tahun lahir tidak cocok.');
        delete fails[key];
        return { user: asUser(m), token: 'demo-' + normNim(m.nim) };
      }
      const key = String(p.id_user || '').trim().toLowerCase(); cekKunci(key);
      const u = db.users.find(x => String(x.id_user).toLowerCase() === key);
      if (!u || String(u.pin) !== String(p.pin)) catatGagal(key, 'NIP/ID atau PIN salah.');

      return { user: publicUser(u), token: 'demo-' + u.id_user };
    },
    // Data untuk halaman cover — tanpa login, NIM disamarkan
    publik(db) {

        jadwal: db.booking.filter(b => b.status === 'Disetujui' && b.tanggal >= t).sort((a, b) => (a.tanggal + a.jam_mulai).localeCompare(b.tanggal + b.jam_mulai)).slice(0, 8)

        jml_alat: db.alat.filter(a => a.status !== 'Nonaktif').length
      };
    },
    bootstrap(db, p, u) {
      const out = { labs: db.labs, alat: db.alat.filter(a => a.status !== 'Nonaktif'), server_time: now() };
      // mahasiswa hanya melihat NIM orang lain dalam bentuk tersamar
      out.booking = u.peran === 'mahasiswa' ? db.booking.map(b => b.id_user === u.id_user ? b : Object.assign({}, b, { id_user: mask(b.id_user) })) : db.booking;
      if (u.peran === 'mahasiswa') {
        out.pinjam = db.pinjam.filter(x => x.id_user === u.id_user);
        out.bahan = [];
        out.mutasi = [];
      } else {
        const lab = u.peran === 'plp' ? u.id_lab : null;
        out.pinjam = lab ? db.pinjam.filter(x => x.id_lab === lab) : db.pinjam;
        out.bahan = db.bahan.filter(b => b.status !== 'Nonaktif');
        out.mutasi = db.mutasi;
      }
      const ids = new Set(out.pinjam.map(x => x.id));
      out.detail = db.detail.filter(d => ids.has(d.id_pinjam));
      // hitung ketersediaan dari SEMUA permohonan aktif (bukan hanya milik user)
      out.terpakai = {}; db.alat.forEach(a => out.terpakai[a.kode] = terpakai(db, a.kode));
      return out;
    },
    ajukanPinjam(db, p, u) {
      if (!p.items || !p.items.length) err('Pilih minimal satu alat.');
      const telat = db.pinjam.some(x => x.id_user === u.id_user && x.status === 'Dipinjam' && x.tgl_kembali < now().slice(0, 10));

      p.items.forEach(it => {

        if (a.id_lab !== p.id_lab) err('Semua alat harus dari lab yang sama.');
        const sisa = a.jml_total - a.jml_rusak - terpakai(db, a.kode);
        if (it.jml > sisa) err(`Stok ${a.nama} tidak cukup (tersedia ${sisa}).`);
      });
      const d = new Date(); const prefix = `PJM-${String(d.getFullYear()).slice(2)}${pad(d.getMonth() + 1)}-`;
      const id = nextId(db.pinjam, prefix);
      db.pinjam.push({
        id, tgl_ajuan: now(), id_user: u.id_user, nama: u.nama, prodi: u.prodi || '', no_hp: p.no_hp || u.no_hp || '', id_lab: p.id_lab,
        keperluan: p.keperluan, mata_kuliah: p.mata_kuliah || '', tgl_pinjam: p.tgl_pinjam, tgl_kembali: p.tgl_kembali, status: 'Menunggu',
        tgl_disetujui: '', disetujui_oleh: '', alasan_tolak: '', tgl_diambil: '', tgl_dikembalikan: '', catatan_mhs: '', kondisi_kembali: '', catatan_plp: '', tgl_selesai: '', link_pdf: ''
      });
      p.items.forEach(it => { const a = db.alat.find(x => x.kode === it.kode_alat); db.detail.push({ id_pinjam: id, kode_alat: a.kode, nama_alat: a.nama, jml: Number(it.jml), jml_rusak: 0 }); });

    },
    aksiPinjam(db, p, u) {
      const r = db.pinjam.find(x => x.id === p.id); if (!r) err('Permohonan tidak ditemukan.');
      const isStaff = u.peran === 'admin' || (u.peran === 'plp' && u.id_lab === r.id_lab);
      const own = r.id_user === u.id_user;
      const need = (cond, msg) => { if (!cond) err(msg); };
      switch (p.aksi) {
        case 'batal': need(own && r.status === 'Menunggu', 'Permohonan tidak bisa dibatalkan.'); r.status = 'Dibatalkan'; break;
        case 'setujui':
          need(isStaff && r.status === 'Menunggu', 'Aksi tidak diizinkan.');
          db.detail.filter(d => d.id_pinjam === r.id).forEach(d => {
            const a = db.alat.find(x => x.kode === d.kode_alat); const sisa = a.jml_total - a.jml_rusak - terpakai(db, a.kode, r.id);
            if (d.jml > sisa) err(`Stok ${a.nama} tidak cukup (tersedia ${sisa}).`);
          });
          r.status = 'Disetujui'; r.tgl_disetujui = now(); r.disetujui_oleh = u.nama; r.link_pdf = 'demo'; break;
        case 'tolak': need(isStaff && r.status === 'Menunggu', 'Aksi tidak diizinkan.'); need(p.alasan, 'Tuliskan alasan penolakan.'); r.status = 'Ditolak'; r.alasan_tolak = p.alasan; r.disetujui_oleh = u.nama; r.tgl_disetujui = now(); break;
        case 'serahkan': need(isStaff && r.status === 'Disetujui', 'Aksi tidak diizinkan.'); r.status = 'Dipinjam'; r.tgl_diambil = now(); break;
        case 'kembalikan': need(own && r.status === 'Dipinjam', 'Aksi tidak diizinkan.'); r.status = 'Dikembalikan'; r.tgl_dikembalikan = now(); r.catatan_mhs = p.catatan || ''; break;
        case 'cek': {
          need(isStaff && ['Dikembalikan', 'Dipinjam'].includes(r.status), 'Aksi tidak diizinkan.');

          let adaRusak = false;
          db.detail.filter(d => d.id_pinjam === r.id).forEach(d => {
            const rusak = Math.max(0, Math.min(Number((p.rusak || {})[d.kode_alat] || 0), d.jml));
            d.jml_rusak = rusak;
            if (rusak > 0) { adaRusak = true; const a = db.alat.find(x => x.kode === d.kode_alat); a.jml_rusak = Number(a.jml_rusak) + rusak; a.catatan = `${rusak} rusak saat ${r.id}`; }
          });
          r.kondisi_kembali = adaRusak ? 'Ada kerusakan' : 'Baik'; r.catatan_plp = p.catatan || ''; r.tgl_selesai = now();

    simpanAlat(db, p, u) {

        const x = db.alat.find(r => r.kode === a.kode); if (!x) err('Alat tidak ditemukan.');
        if (u.peran === 'plp' && x.id_lab !== u.id_lab) err('Bukan alat lab Anda.');
        Object.assign(x, { nama: a.nama, merk: a.merk, satuan: a.satuan, jml_total: +a.jml_total, jml_rusak: +a.jml_rusak, lokasi: a.lokasi, tahun: a.tahun, status: a.status || 'Aktif', catatan: a.catatan || '' });
        if (p.foto) x.foto_url = p.foto; return { kode: x.kode };

    simpanBahan(db, p, u) {
      if (u.peran === 'mahasiswa') err('Tidak diizinkan.');

      if (!b.nama || !lab) err('Nama bahan dan lab wajib diisi.');

      db.mutasi.push({ id: nextId(db.mutasi, 'MUT-'), tgl: now(), kode_bahan: b.kode, jenis: p.jenis, jumlah: j, keperluan: p.keperluan || '', oleh: u.nama });

    ajukanBooking(db, p, u) {

      const dibuat = [], dilewati = [];

        if (b) { if (tgls.length === 1) err(`Bentrok dengan "${b.kegiatan}" ${b.sesi ? '(' + b.sesi + ')' : '(' + b.jam_mulai + '–' + b.jam_selesai + ')'}.`); dilewati.push(t); return; }

        dibuat.push(t);
      });
      if (!dibuat.length) err('Semua tanggal bentrok dengan jadwal lain.');
      return { dibuat, dilewati };

  async function call(action, payload, token) {
    await new Promise(r => setTimeout(r, 120)); // simulasi jaringan
    const db = load();
    const h = handlers[action]; if (!h) throw new Error('Aksi tidak dikenal: ' + action);
    let user = null;
    if (action !== 'login' && action !== 'publik') {
      const id = String(token || '').replace(/^demo-/, '');
      user = db.users.find(x => x.id_user === id);
      if (!user) { const m = findMhs(db, id); if (m) user = asUser(m); }
      if (!user) throw new Error('Sesi berakhir, silakan masuk lagi.');
    }

function fdate(s, withTime) {
  if (!s) return '—'; const [d, t] = String(s).split(' '); const [y, m, dd] = d.split('-');
  if (!m) return s; return `${+dd} ${BLN[+m - 1]} ${y}${withTime && t ? ', ' + t : ''}`;
}
const fday = s => { const d = new Date(s + 'T00:00:00'); return `${HARI[d.getDay()]}, ${fdate(s)}`; };

const isDemo = () => !CONFIG.API_URL;
async function api(action, payload = {}) {
  if (isDemo()) return Demo.call(action, payload, S.token);
  const res = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload, token: S.token }) });
  const j = await res.json();
  if (!j.ok) { if (j.code === 'AUTH') logout(true); throw new Error(j.error || 'Terjadi kesalahan di server.'); }
  return j.data;
}

let toastT;
function toast(msg) { let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
function modal(html) { closeModal(); const s = document.createElement('div'); s.className = 'scrim'; s.id = 'scrim'; s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; s.addEventListener('click', e => { if (e.target === s || e.target.closest('[data-close]')) closeModal(); }); document.body.appendChild(s); document.body.style.overflow = 'hidden'; const f = s.querySelector('input,select,textarea'); if (f && innerWidth > 640) f.focus(); return s; }
function closeModal() { const s = $('#scrim'); if (s) s.remove(); document.body.style.overflow = ''; }
const head = (t, sub) => `<div class="sheet-head"><div><h3>${t}</h3>${sub ? `<p class="muted small">${sub}</p>` : ''}</div><button class="x" data-close aria-label="Tutup">×</button></div>`;
async function run(fn, okMsg) {
  if (S.busy) return; S.busy = true; document.body.style.cursor = 'progress';
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message || String(e)); throw e; }
  finally { S.busy = false; document.body.style.cursor = ''; }
}

function timeline(p) {
  const tolak = p.status === 'Ditolak', batal = p.status === 'Dibatalkan';
  const steps = [
    ['Diajukan', p.tgl_ajuan, true],
    [tolak ? 'Ditolak PLP' : 'Disetujui PLP', p.tgl_disetujui, !!p.tgl_disetujui, tolak ? 'fail' : '', tolak ? 'Alasan: ' + p.alasan_tolak : (p.disetujui_oleh ? 'oleh ' + p.disetujui_oleh : '')],
    ['Alat diambil', p.tgl_diambil, !!p.tgl_diambil],
    ['Alat dikembalikan', p.tgl_dikembalikan, !!p.tgl_dikembalikan, '', p.catatan_mhs ? 'Catatan: ' + p.catatan_mhs : ''],
    ['Dicek PLP — selesai', p.tgl_selesai, !!p.tgl_selesai, '', p.kondisi_kembali ? `Kondisi: ${p.kondisi_kembali}${p.catatan_plp ? ' — ' + p.catatan_plp : ''}` : '']
  ];
  if (tolak || batal) steps.splice(2);
  if (batal) steps[1] = ['Dibatalkan oleh pemohon', '', true, 'fail', ''];
  let nowSet = false;
  return `<ol class="tl">${steps.map(([t, d, done, cls, extra], i) => {
    let c = done ? 'done' : ''; if (cls) c = cls; if (!done && !nowSet && !cls) { c = 'now'; nowSet = true; }
    return `<li class="${c}"><span class="ic">${c === 'done' ? '✓' : c === 'fail' ? '✕' : i + 1}</span><div><div class="t">${t}</div>
      <div class="d">${d ? fdate(d, true) : c === 'now' ? (isLate(p) && i === 3 ? `<b style="color:var(--bad)">Terlambat — batas ${fdate(p.tgl_kembali)}</b>` : 'Sedang diproses') : ''}${extra ? '<br>' + esc(extra) : ''}</div></div></li>`;
  }).join('')}</ol>`;
}

const SESI_LBL = { 'Sesi 1': 'Sesi 1 · 08.00–12.00', 'Sesi 2': 'Sesi 2 · 13.00–17.00', 'Seharian': 'Seharian · 08.00–17.00' };

let calMonth = null, calDay = null;
function vJadwal() {
  const t0 = today(); const lab = S.user.peran === 'plp' ? S.user.id_lab : S.lab;
  if (!calMonth) calMonth = t0.slice(0, 7);
  const aktif = b => (lab === 'ALL' || b.id_lab === lab) && !['Dibatalkan', 'Ditolak'].includes(b.status);
  const all = S.data.booking.filter(aktif);
  // kalender bulanan
  const [y, m] = calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1), days = new Date(y, m, 0).getDate(), lead = (first.getDay() + 6) % 7;
  const cnt = {}; all.forEach(b => { if (b.tanggal.startsWith(calMonth)) cnt[b.tanggal] = (cnt[b.tanggal] || 0) + 1; });
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<span></span>');
  for (let d = 1; d <= days; d++) {
    const ds = `${calMonth}-${pad(d)}`;
    cells.push(`<button class="day${ds === t0 ? ' today' : ''}${ds === calDay ? ' sel' : ''}" data-day="${ds}" aria-label="${fday(ds)}${cnt[ds] ? ', ' + cnt[ds] + ' jadwal' : ''}"><span>${d}</span>${cnt[ds] ? `<i>${cnt[ds] > 3 ? '3+' : '•'.repeat(cnt[ds])}</i>` : ''}</button>`);
  }
  const list = all.filter(b => calDay ? b.tanggal === calDay : b.tanggal >= t0 && b.tanggal <= addDays(t0, 30)).sort((a, b) => (a.tanggal + a.jam_mulai).localeCompare(b.tanggal + b.jam_mulai));
  const byDay = {}; list.forEach(b => (byDay[b.tanggal] = byDay[b.tanggal] || []).push(b));
  const mine = !isStaff() ? S.data.booking.filter(b => b.id_user === S.user.id_user && b.status === 'Ditolak') : [];
  const labObj = lab !== 'ALL' ? S.data.labs.find(l => l.id_lab === lab) : null;
  return `<div class="page-head"><div><h2>Jadwal Penggunaan Lab</h2><p>${labObj ? `${esc(labObj.nama_lab)} · kapasitas ${labObj.kapasitas || 50} orang${labObj.mode_jadwal === 'sesi' ? ' · sistem sesi' : ''}` : 'Pilih lab untuk melihat jadwalnya.'}</p></div>
    <button class="btn primary" data-act="booking-new">${ico('plus')} ${isStaff() ? 'Tambah jadwal' : 'Ajukan jadwal'}</button></div>
  ${labChips()}
  ${labObj ? `<div>${sopLink(labObj)}</div>` : ''}
  ${mine.map(b => `<div class="warnbox">Jadwal "${esc(b.kegiatan)}" (${fdate(b.tanggal)}) ditolak${b.catatan ? ': ' + esc(b.catatan) : ''}.</div>`).join('')}
  <div class="card cal">
    <div class="cal-head"><button class="x" data-cal="-1" aria-label="Bulan sebelumnya">‹</button><b>${BLN_FULL[m - 1]} ${y}</b><button class="x" data-cal="1" aria-label="Bulan berikutnya">›</button></div>
    <div class="cal-grid">${['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map(h => `<span class="dow">${h}</span>`).join('')}${cells.join('')}</div>
  </div>
  <div class="row"><p class="section-title grow">${calDay ? fday(calDay) : '30 hari ke depan'}</p>${calDay ? '<button class="btn sm" data-day="">Tampilkan semua</button>' : ''}</div>
  ${Object.keys(byDay).length ? Object.entries(byDay).map(([d, bs]) => `<div class="list">${calDay ? '' : `<p class="section-title">${d === t0 ? 'Hari ini · ' : ''}${fday(d)}</p>`}
    ${bs.map(b => {
      const staffOK = isStaff() && (S.user.peran === 'admin' || S.user.id_lab === b.id_lab);

        ${b.status === 'Menunggu' && b.id_user === S.user.id_user ? `<div class="actions" style="justify-content:flex-start"><button class="btn sm danger" data-act="b-batal" data-id="${b.id}">Batalkan</button></div>` : ''}

/* ===================== PLP/ADMIN: DASHBOARD ===================== */
function bahanLevel(b) {
  if (b.stok <= 0) return ['Habis', 'var(--bad)', 'p-bad'];
  if (b.stok < b.stok_min) return ['Di bawah minimum', 'var(--bad)', 'p-bad'];
  if (b.stok < b.stok_min * 1.5) return ['Menipis', 'var(--warn)', 'p-wait'];
  return ['Aman', 'var(--ok)', 'p-ok'];
}
const daysTo = s => Math.round((new Date(s + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 864e5);

  const rusak = alat.reduce((s, a) => s + +a.jml_rusak, 0);

  const top = Object.entries(usage).sort((a, b) => b[1] - a[1]).slice(0, 5); const maxU = top[0]?.[1] || 1;
  const jadwal = S.data.booking.filter(b => inScope(b) && b.tanggal === today() && b.status === 'Disetujui').sort((a, b) => a.jam_mulai.localeCompare(b.jam_mulai));

  <div class="kpis">${K(totalUnit, 'Unit alat', 'var(--primary)', 'alat')}${K(dipinjam, 'Sedang dipinjam', 'var(--sky)', 'permohonan')}${K(rusak, 'Unit rusak', 'var(--bad)', 'alat')}
    ${K(tipis.length, 'Bahan menipis', 'var(--warn)', 'bahan')}${K(exp.length, 'Kedaluwarsa ≤30 hari', 'var(--lime)', 'bahan')}${K(aksi, 'Perlu tindakan', 'var(--info)', 'permohonan')}</div>
  <div class="grid2" style="align-items:start">
    <div class="card list"><p class="section-title">Perlu perhatian</p>
      ${late.map(p => `<button class="row" data-act="detail" data-id="${p.id}" style="border:0;background:none;text-align:left;cursor:pointer;padding:0"><span class="pill p-bad">Terlambat</span><span class="grow small">${esc(p.nama)} — ${esc(p.id)}, batas ${fdate(p.tgl_kembali)}</span></button>`).join('')}
      ${tipis.map(b => { const [t, , c] = bahanLevel(b); return `<div class="row"><span class="pill ${c}">${t}</span><span class="grow small">${esc(b.nama)} — sisa ${fnum(b.stok)} ${esc(b.satuan)} (min ${fnum(b.stok_min)})</span></div>`; }).join('')}
      ${exp.map(b => { const d = daysTo(b.exp_date); return `<div class="row"><span class="pill ${d < 0 ? 'p-bad' : 'p-wait'}">${d < 0 ? 'Kedaluwarsa' : d + ' hari lagi'}</span><span class="grow small">${esc(b.nama)} — exp ${fdate(b.exp_date)}${b.b3 === 'Ya' ? ' · B3' : ''}</span></div>`; }).join('')}
      ${!late.length && !tipis.length && !exp.length ? '<p class="muted small">Semua aman.</p>' : ''}
    </div>
    <div class="list">
      <div class="card list"><p class="section-title">Jadwal lab hari ini</p>
        ${jadwal.length ? jadwal.map(b => `<div class="row small"><span class="mono num" style="font-weight:700">${esc(waktuLbl(b))}</span><span class="grow">${esc(b.kegiatan)} · ${esc(b.kelas || '')}${scopeLab() ? '' : ' · ' + esc(labShort(b.id_lab))}</span></div>`).join('') : '<p class="muted small">Tidak ada jadwal.</p>'}

      </div>

  </tbody></table></div></div>` : ''}`;
}

function resizeImg(file, max = 480) {
  return new Promise(res => { if (!file) return res(null); const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const r = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = im.width * r; c.height = im.height * r; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .72)); }; im.src = fr.result; }; fr.readAsDataURL(file); });

  $('#fBhn').addEventListener('submit', async e => {
    e.preventDefault();
    const bahan = { kode: kode || '', id_lab: $('#bhLab')?.value, nama: $('#hNama').value.trim(), satuan: $('#hSat').value, stok: $('#hStok') ? +$('#hStok').value : undefined, stok_min: +$('#hMin').value, exp_date: $('#hExp').value, b3: $('#hB3').value, lokasi: $('#hLok').value };
    await run(() => api('simpanBahan', { bahan }), 'Data bahan tersimpan.'); closeModal(); await refresh();
  });
}
function formMutasi(kode, jenis) {
  const b = S.data.bahan.find(x => x.kode === kode);
  modal(`${head(`Catat bahan ${jenis.toLowerCase()}`, `${esc(b.nama)} · stok sekarang ${fnum(b.stok)} ${esc(b.satuan)}`)}<form id="fMut" class="list">
    <div class="field"><label for="mJml">Jumlah (${esc(b.satuan)})</label><input id="mJml" type="number" min="0" step="any" required></div>
    <div class="field"><label for="mKep">${jenis === 'Masuk' ? 'Sumber / keterangan' : 'Dipakai untuk'}</label><input id="mKep" required placeholder="${jenis === 'Masuk' ? 'mis. Pengadaan semester ganjil' : 'mis. Praktikum Analisis Zat Gizi kelas 2A'}"></div>
    ${jenis === 'Masuk' ? `<div class="field"><label for="mExp">Tanggal kedaluwarsa batch baru (opsional)</label><input id="mExp" type="date"></div>` : ''}
    <div class="actions"><button type="button" class="btn" data-close>Batal</button><button class="btn primary" type="submit">Simpan</button></div></form>`);
  $('#fMut').addEventListener('submit', async e => {
    e.preventDefault();
    await run(() => api('mutasiBahan', { kode_bahan: kode, jenis, jumlah: +$('#mJml').value, keperluan: $('#mKep').value, exp_date: $('#mExp')?.value || '' }), `Bahan ${jenis.toLowerCase()} tercatat.`); closeModal(); await refresh();
  });
}
function openRiwayat(kode) {
  const b = S.data.bahan.find(x => x.kode === kode);
  const rows = S.data.mutasi.filter(m => m.kode_bahan === kode).sort((a, c) => c.tgl.localeCompare(a.tgl));
  modal(`${head('Riwayat mutasi', esc(b.nama))}
  ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th class="r">Jumlah</th><th>Keterangan</th></tr></thead><tbody>
  ${rows.map(m => `<tr><td>${fdate(m.tgl, true)}</td><td><span class="pill ${m.jenis === 'Masuk' ? 'p-ok' : 'p-info'}">${m.jenis}</span></td><td class="r num">${m.jenis === 'Masuk' ? '+' : '−'}${fnum(m.jumlah)}</td><td style="white-space:normal;min-width:180px">${esc(m.keperluan)}<br><span class="muted small">${esc(m.oleh)}</span></td></tr>`).join('')}
  </tbody></table></div>` : '<div class="empty">Belum ada mutasi.</div>'}`);
}

/* ===================== EKSPOR CSV ===================== */
function exportCSV() {
  const csv = (rows) => rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const alat = S.data.alat.filter(inScope).map(a => [a.kode, labName(a.id_lab), a.nama, a.merk, a.jml_total, a.jml_rusak, S.data.terpakai[a.kode] || 0, tersedia(a), a.satuan, a.lokasi, a.tahun]);
  const bahan = S.data.bahan.filter(inScope).map(b => [b.kode, labName(b.id_lab), b.nama, b.stok, b.stok_min, b.satuan, b.exp_date, b.b3, bahanLevel(b)[0]]);
  const out = '﻿INVENTARIS ALAT\n' + csv([['Kode', 'Lab', 'Nama', 'Merk', 'Total', 'Rusak', 'Dipinjam', 'Tersedia', 'Satuan', 'Lokasi', 'Tahun'], ...alat]) +
    '\n\nSTOK BAHAN\n' + csv([['Kode', 'Lab', 'Nama', 'Stok', 'Stok Min', 'Satuan', 'Kedaluwarsa', 'B3', 'Status'], ...bahan]);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: 'text/csv' })); a.download = `rekap-lab-${today()}.csv`; document.body.appendChild(a); a.click(); a.remove();
  toast('Rekap diunduh.');
}

/* ===================== AKUN ===================== */
function openAkun() {
  const u = S.user;
  modal(`${head(esc(u.nama), `<span class="mono">${esc(u.id_user)}</span> · ${u.peran === 'plp' ? 'PLP ' + esc(labName(u.id_lab)) : u.peran === 'admin' ? 'Admin / Kepala Lab' : 'Mahasiswa'}`)}
    <div class="note">${isDemo() ? '<b>Mode demo.</b> Data contoh tersimpan di browser ini saja. Isi <span class="mono">API_URL</span> di kode untuk terhubung ke Google Sheet.' : 'Terhubung ke Google Sheet Jurusan Gizi.'}</div>
    <div class="actions"><button class="btn" data-go="cover">Halaman depan & panduan</button>${isDemo() ? '<button class="btn" data-act="reset">Kembalikan data demo</button>' : ''}<button class="btn danger" data-act="logout">Keluar</button></div>`);
}

/* ===================== EVENT ===================== */
document.addEventListener('click', async e => {
  const go = e.target.closest('[data-go]');
  if (go) { closeModal(); const g = go.dataset.go; if (g === 'cover') { S.user = S.data = null; PUB = null; renderCover(); } else if (g === 'login') renderLogin(); else enterApp(); return; }
  const gd = e.target.closest('[data-guide]'); if (gd) { guideRole = gd.dataset.guide; const y = scrollY; await renderCover(); scrollTo(0, y); return; }
  const cal = e.target.closest('[data-cal]');
  if (cal) { const [y, m] = calMonth.split('-').map(Number); const d = new Date(y, m - 1 + Number(cal.dataset.cal), 1); calMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; calDay = null; render(); return; }
  const dy = e.target.closest('[data-day]'); if (dy) { calDay = dy.dataset.day && dy.dataset.day !== calDay ? dy.dataset.day : null; render(); return; }
  const md = e.target.closest('[data-mode]'); if (md) { loginMode = md.dataset.mode; renderLogin(); return; }
  const nav = e.target.closest('[data-nav]'); if (nav) { closeModal(); S.view = nav.dataset.nav; S.q = ''; render(); scrollTo(0, 0); return; }
  const lab = e.target.closest('[data-lab]'); if (lab) { S.lab = lab.dataset.lab; calDay = null; render(); return; }
  const fl = e.target.closest('[data-filter]'); if (fl) { S.filter = fl.dataset.filter; render(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const { act, id, kode } = b.dataset;
  try {
    switch (act) {
      case 'akun': return openAkun();
      case 'logout': return logout();
      case 'reset': Demo.reset(); PUB = null; closeModal(); await refresh(); return toast('Data demo dikembalikan.');
      case 'cart-add': {
        const a = S.data.alat.find(x => x.kode === kode);
        if (S.cart.id_lab && S.cart.id_lab !== a.id_lab && Object.keys(S.cart.items).length) return toast(`Keranjang berisi alat ${labShort(S.cart.id_lab)}. Ajukan atau kosongkan dulu.`);
        S.cart.id_lab = a.id_lab; S.cart.items[kode] = 1; render(); return toast(`${a.nama} masuk keranjang.`);
      }
      case 'cart-del': delete S.cart.items[kode]; if (!Object.keys(S.cart.items).length) S.cart.id_lab = null; return render();
      case 'detail': return openDetail(id);
      case 'bukti': return openBukti(id);
      case 'pdf-save': { const p = S.data.pinjam.find(x => x.id === id); buatPdf(p).save(`Bukti-${id}.pdf`); return toast('PDF diunduh.'); }
      case 'p-batal': await run(() => api('aksiPinjam', { id, aksi: 'batal' }), 'Permohonan dibatalkan.'); closeModal(); return refresh();
      case 'p-setujui': await run(() => api('aksiPinjam', { id, aksi: 'setujui' }), 'Disetujui. Bukti PDF dibuat.'); closeModal(); await refresh(); return openDetail(id);
      case 'p-tolak': return formTolak(id);
      case 'p-serah': await run(() => api('aksiPinjam', { id, aksi: 'serahkan' }), 'Alat diserahkan ke peminjam.'); closeModal(); await refresh(); return openDetail(id);
      case 'p-kembali': return formKembali(id);
      case 'p-cek': return formCek(id);
      case 'booking-new': return formBooking();
      case 'b-setujui': await run(() => api('aksiBooking', { id, aksi: 'setujui' }), 'Jadwal disetujui.'); return refresh();
      case 'b-tolak': await run(() => api('aksiBooking', { id, aksi: 'tolak', alasan: 'Ruangan tidak tersedia' }), 'Jadwal ditolak.'); return refresh();
      case 'b-batal': await run(() => api('aksiBooking', { id, aksi: 'batal' }), 'Jadwal dibatalkan.'); return refresh();
      case 'alat-new': return formAlat();
      case 'alat-edit': return formAlat(kode);
      case 'qr': return openQR(kode);
      case 'qr-save': { const c = document.querySelector('#qrHere canvas'); if (!c) return; const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = `QR-${kode}.png`; a.click(); return; }
      case 'bahan-new': return formBahan();
      case 'bahan-edit': return formBahan(kode);
      case 'mut': return formMutasi(kode, b.dataset.jenis);
      case 'riwayat': return openRiwayat(kode);
      case 'export': return exportCSV();
    }
  } catch (err) { /* pesan sudah ditampilkan lewat toast */ }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.dataset.qty) { S.cart.items[e.target.dataset.qty] = Math.max(1, +e.target.value || 1); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fPinjam') return; e.preventDefault();
  const payload = { id_lab: S.cart.id_lab, items: Object.entries(S.cart.items).map(([kode_alat, jml]) => ({ kode_alat, jml })), keperluan: $('#pKep').value, mata_kuliah: $('#pMk').value, tgl_pinjam: $('#pTp').value, tgl_kembali: $('#pTk').value, no_hp: $('#pHp').value };
  try {
    const r = await run(() => api('ajukanPinjam', payload), 'Permohonan terkirim.');
    S.cart = { id_lab: null, items: {} }; S.view = 'permohonan'; await refresh(); openDetail(r.id);
  } catch (err) { }
});

/* ===================== MULAI ===================== */
// pesan error sudah tampil lewat toast; cegah log 'unhandled rejection'
window.addEventListener('unhandledrejection', e => e.preventDefault());
renderCover(); // aplikasi selalu dibuka dari halaman depan
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname)) {
  navigator.serviceWorker.register('sw.js').catch(() => { });
}

</script></body></html>
